      sheet.setAttribute('aria-label', 'Desliza hacia la izquierda para pasar la página');
      return new Promise(resolve => {
        let start = null;
        const down = event => {
          if (!event.isPrimary) return;
          start = { x: event.clientX, y: event.clientY, id: event.pointerId };
          sheet.setPointerCapture(event.pointerId);
        };
        const cleanup = () => {
          sheet.removeEventListener('pointerdown', down);
          sheet.removeEventListener('pointerup', up);
          sheet.removeEventListener('pointercancel', cancel);
          sheet.removeEventListener('keydown', key);
          resolve();
        };
        const up = event => {
          if (!start || event.pointerId !== start.id) return;
          const dx = event.clientX - start.x, dy = event.clientY - start.y;
          start = null;
          if (dx < -35 && Math.abs(dx) > Math.abs(dy)) cleanup();
        };
        const cancel = () => { start = null; };
        const key = event => { if (event.key === 'ArrowLeft') { event.preventDefault(); cleanup(); } };
        sheet.addEventListener('pointerdown', down);
        sheet.addEventListener('pointerup', up);
        sheet.addEventListener('pointercancel', cancel);
        sheet.addEventListener('keydown', key);
      });
    }
    function autoZoomMagazine() {
      magazineScale = Math.max(1, magazine.clientHeight / magazineSheet.clientHeight);
      magazineX = 0; magazineY = 0;
      applyMagazineView();
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const target = magazineImage.style.transform;
        magazineImage.animate([
          { transform: 'translate(0,0) scale(1)' },
          { transform: target }
        ], { duration: 1100, easing: 'cubic-bezier(.22,.65,.25,1)' });
      }
    }
    const easyGrab = document.createElement('div');
    easyGrab.className = 'hand-easy-grab';
    easyGrab.setAttribute('aria-hidden', 'true');
    magazine.append(easyGrab);
    easyGrab.addEventListener('pointerdown', event => {
      if (!event.isPrimary || ipodTaken) return;
      cancelAnimationFrame(springFrame);
      handDrag = { x: event.clientX, y: event.clientY, id: event.pointerId, extension: handExtension };
      hand.setPointerCapture(event.pointerId);
    });
    const musicOverlay = document.createElement('div');
    musicOverlay.className = 'music-overlay'; musicOverlay.hidden = true;
    musicOverlay.innerHTML = '<img class="song-art" src="assets/cancion1.png" alt="Canción 1"><button class="music-wheel" type="button" aria-label="Cambiar canción"></button><span class="music-status" role="status" aria-live="polite"></span>';
    magazine.querySelector('.ipod-full').append(musicOverlay);
    const musicAudio = new Audio(); musicAudio.preload = 'metadata';
    const ipodSongs = [1,2,3,4].map(n => ({ image: `assets/cancion${n}.png`, audio: n === 1 ? 'assets/audio/cancion1-v2.mp3' : `assets/audio/cancion${n}.mp3` }));
    let songIndex = -1;
    const heardSongs = new Set();
    function positionMusic() {
      if (musicOverlay.hidden || ipodTaken) return;
      const rect = ipod.getBoundingClientRect(), host = magazine.getBoundingClientRect();
      Object.assign(musicOverlay.style, { left: `${rect.left - host.left}px`, top: `${rect.top - host.top}px`, width: `${rect.width}px`, height: `${rect.height}px` });
    }
    function showIpodMusic() {
      musicOverlay.hidden = false;
      positionMusic();
      musicOverlay.querySelector('.music-status').textContent = 'Haz círculos en la rueda para cambiar';
    }
    async function changeIpodSong(direction = 1) {
      if (ipodTaken) return;
      songIndex = songIndex < 0 ? 0 : (songIndex + direction + ipodSongs.length) % ipodSongs.length;
      const song = ipodSongs[songIndex];
      const art = musicOverlay.querySelector('.song-art');
      art.src = song.image; art.alt = `Canción ${songIndex + 1}`;
      musicAudio.pause(); musicAudio.removeAttribute('src'); musicAudio.load();
      musicOverlay.querySelector('.music-status').textContent = `${songIndex + 1} / 4`;
      heardSongs.add(songIndex);
      if (song.audio) {
        musicAudio.src = song.audio;
        try { await musicAudio.play(); } catch (_) { musicOverlay.querySelector('.music-status').textContent = 'Haz otro círculo para escuchar'; }
      }
      if (heardSongs.size === 4) {
        magazine.classList.add('music-explored');
        hand.disabled = false;
        stretchHand(0);
      }
    }
    window.addEventListener('resize', positionMusic);
    const musicWheel = musicOverlay.querySelector('.music-wheel');
    musicWheel.setAttribute('aria-label', 'Haz círculos para cambiar de canción');
    let wheelGesture = null;
    function wheelPoint(event) {
      const rect = musicWheel.getBoundingClientRect();
      const x = (event.clientX - rect.left - rect.width / 2) / (rect.width / 2);
      const y = (event.clientY - rect.top - rect.height / 2) / (rect.height / 2);
      return { angle: Math.atan2(y, x), radius: Math.hypot(x, y) };
    }
    musicWheel.addEventListener('pointerdown', event => {
      if (!event.isPrimary || ipodTaken) return;
      const point = wheelPoint(event);
      wheelGesture = { id: event.pointerId, angle: point.angle, turn: 0 };
      musicWheel.setPointerCapture(event.pointerId);
    });
    musicWheel.addEventListener('pointermove', event => {
      if (!wheelGesture || event.pointerId !== wheelGesture.id) return;
      const point = wheelPoint(event);
      if (point.radius < .25 || point.radius > 1.65) { wheelGesture.angle = point.angle; return; }
      let delta = point.angle - wheelGesture.angle;
      if (delta > Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;
      wheelGesture.angle = point.angle;
      if (Math.abs(delta) > 1.3) return;
      wheelGesture.turn += delta;
      if (Math.abs(wheelGesture.turn) >= Math.PI * 1.8) {
        const direction = wheelGesture.turn > 0 ? 1 : -1;
        wheelGesture.turn = 0;
        changeIpodSong(direction);
      }
    });
    function releaseWheel() { wheelGesture = null; }
    musicWheel.addEventListener('pointerup', releaseWheel);
    musicWheel.addEventListener('pointercancel', releaseWheel);
    musicWheel.addEventListener('lostpointercapture', releaseWheel);
    musicWheel.addEventListener('keydown', event => {
      if (['ArrowRight', 'ArrowLeft', 'Enter', ' '].includes(event.key)) {
        event.preventDefault(); changeIpodSong(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
    let initialMicStream = null, initialAudioContext = null;
    const experienceStart = document.createElement('section');
    experienceStart.className = 'experience-start';
    experienceStart.setAttribute('aria-label', 'Activar la experiencia');
    experienceStart.innerHTML = '<div class="start-content"><h1>Antes de comenzar</h1><p class="start-permissions">Permite el micrófono y activa el sonido antes de comenzar.</p><button type="button" class="experience-start-button">Activar y comenzar</button><p class="start-status" role="status" aria-live="polite"></p></div>';
    document.body.append(experienceStart);
    const phoneAudio = new Audio('assets/audio/celular-inicio.mp3');
    phoneAudio.preload = 'auto'; phoneAudio.loop = true; phoneAudio.volume = 1;
    let phoneAudioStarted = false, phoneAnswered = false;
    async function startPhoneAudio() {
      if (phoneAudioStarted || phoneAnswered) return;
      try { await phoneAudio.play(); phoneAudioStarted = true; } catch (_) { }
    }
    function stopPhoneAudio() {
      phoneAnswered = true;
      phoneAudio.pause(); phoneAudio.currentTime = 0;
    }
    const startButton = experienceStart.querySelector('button');
    startButton.addEventListener('click', async () => {
      if (experienceStart.dataset.microphone === 'unavailable') { beginPhoneScene(); return; }
      // Request motion first: fullscreen can consume the initial permission gesture.
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass && !initialAudioContext) initialAudioContext = new AudioContextClass();
      initialAudioContext?.resume().catch(() => {});
      startButton.disabled = true;
      experienceStart.querySelector('.start-status').textContent = 'Activa los permisos que te pida el navegador…';
      // Start playback directly inside the click so the browser can authorize sound.
      // Unlock playback in the initial gesture, keeping it silent during permissions.
      phoneAudio.muted = true;
      const playback = startPhoneAudio();
      const movement = enableRoomMotion();
      const microphone = navigator.mediaDevices?.getUserMedia
        ? navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            initialMicStream = stream;
            experienceStart.dataset.microphone = 'granted';
          }).catch(() => { experienceStart.dataset.microphone = 'unavailable'; })
        : Promise.resolve();
      await Promise.allSettled([playback, microphone, movement]);

      if (experienceStart.dataset.microphone === 'unavailable') {
        experienceStart.querySelector('.start-status').textContent = 'El micrófono no está disponible. Puedes continuar y usar la opción escrita cuando sea necesario.';
        startButton.textContent = 'Continuar';
        startButton.disabled = false;

        return;
      }
      beginPhoneScene();
    });
    function beginPhoneScene() {
      experienceStart.remove();
      phoneAudio.pause();
      phoneAudio.currentTime = 0;
      phoneAudioStarted = false;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        phoneAudio.muted = false;
        startPhoneAudio();
      }));
    }
    const backgroundMusic = new Audio('assets/audio/fondo-bailan-sin-cesar.mp3');
    backgroundMusic.preload = 'auto';
    backgroundMusic.loop = true;
    backgroundMusic.volume = .22;
    let backgroundGain = null, backgroundSource = null, desiredBackgroundVolume = .22;
    function configureBackgroundGain() {
      if (!backgroundGain && initialAudioContext) {
        try {
          backgroundSource = initialAudioContext.createMediaElementSource(backgroundMusic);
          backgroundGain = initialAudioContext.createGain();
          backgroundGain.gain.value = desiredBackgroundVolume;
          backgroundSource.connect(backgroundGain);
          backgroundGain.connect(initialAudioContext.destination);
          backgroundMusic.volume = 1;
        } catch (_) { }
      }
    }
    function startBackgroundMusic() {
      configureBackgroundGain();
      initialAudioContext?.resume().catch(() => {});
      backgroundMusic.play().catch(() => {
        document.addEventListener('pointerdown', () => backgroundMusic.play().catch(() => {}), { once: true });
      });
    }
    function fadeBackgroundVolume(target) {
      const inPlayer = magazine.classList.contains('ipod-open') && !ipodTaken;
      desiredBackgroundVolume = inPlayer ? .008 : target;
      configureBackgroundGain();
      if (backgroundGain) {
        backgroundMusic.muted = false;
        const now = initialAudioContext.currentTime;
        backgroundGain.gain.cancelScheduledValues(now);
        backgroundGain.gain.setTargetAtTime(desiredBackgroundVolume, now, .18);
      } else {
        // Some mobile browsers ignore media.volume; mute prevents overlap there.
        backgroundMusic.muted = inPlayer || target === 0;
        backgroundMusic.volume = desiredBackgroundVolume;
      }
    }
    let voicePrepared = false;
    async function prepareVoiceAtStart() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return;
      recognition = new Speech();
      recognition.lang = 'es-MX';
      recognition.continuous = false;
      recognition.interimResults = false;
      experienceStart.querySelector('.start-status').textContent = 'Permite también el reconocimiento de voz para completar la activación.';
      await new Promise(resolve => {
        let started = false, finished = false;
        function done() {
          if (finished) return;
          finished = true;
          voicePrepared = started;
          recognition.onstart = null; recognition.onend = null; recognition.onerror = null;
          resolve();
        }
        recognition.onstart = () => { started = true; recognition.abort(); };
        recognition.onend = done;
        recognition.onerror = event => { if (event.error !== 'aborted') started = false; done(); };
        try { recognition.start(); } catch (_) { done(); }
      });
    }
    let diaryCountdownToken = 0;
    async function beginDiaryCountdown() {
      const token = ++diaryCountdownToken;
      stopDiaryListening();
      fadeBackgroundVolume(0);
      const heading = closeup.querySelector('.diary-voice h2');
      heading.textContent = 'Di la contraseña';
      status.textContent = '';
      // Let the one-second approach settle before showing the three beats.
      await new Promise(resolve => setTimeout(resolve, 1150));
      for (const number of [3, 2, 1]) {
        if (token !== diaryCountdownToken || closeup.hidden) return;
        status.textContent = String(number);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      if (token !== diaryCountdownToken || closeup.hidden) return;
      status.textContent = '';
      startVoice();
    }
    function syncMobileViewport() {
      const height = window.visualViewport?.height || innerHeight;
      document.documentElement.style.setProperty('--experience-height', `${Math.round(height)}px`);
    }
    function requestExperienceFullscreen() {
      if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
      document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    }
    window.visualViewport?.addEventListener('resize', syncMobileViewport);
    window.addEventListener('pageshow', syncMobileViewport);
    syncMobileViewport();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && motionGranted) {
        lastRoomAlpha = null; baseline = null; roomTargetPan = pan;
        window.removeEventListener('deviceorientation', readTilt);
        window.addEventListener('deviceorientation', readTilt);
      }
    });
  </script>
</body>
